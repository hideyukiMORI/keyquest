name: Bug
description: Report incorrect behavior.
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: What is happening now?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: How can we reproduce it?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      placeholder: npm run verify
    validations:
      required: true
